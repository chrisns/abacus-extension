<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 -apple-system, sans-serif; width: 240px; padding: 10px 12px; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Abacus Mental Math Helper</h1>
    <label><input type="checkbox" id="hideTimer" /> Hide the timer</label>
    <label><input type="checkbox" id="limitWrongAnswers" /> Stop after 2 wrong answers</label>
    <label><input type="checkbox" id="playAgainButton" /> Add a play-again button</label>
    <script src="popup.js"></script>
  </body>
</html>
