name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v1.8.0. Defaults to the script's own @version."
        required: false
        type: string
      notes:
        description: "Release notes. GitHub's generated notes are appended to them."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - run: node --check abacus-mental-math-helper.user.js

      - name: Work out the tag and the notes
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          version="$(sed -n 's|^// @version *||p' abacus-mental-math-helper.user.js | head -1 | tr -d '[:space:]')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # An annotated tag carries its own message; use that as the body.
            tag="$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$tag" > notes.md
          else
            # Dispatched: the release creates the tag, at the dispatched commit.
            tag="${INPUT_VERSION:-v$version}"
            printf '%s\n' "$INPUT_NOTES" > notes.md
          fi
          # Tampermonkey decides whether to offer an update from @version, so a
          # tag that disagrees with it would ship a release nobody is offered.
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match @version $version in the userscript" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          payload="$(jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg body "$(cat notes.md)" \
            '{tag_name: $tag, name: $tag, target_commitish: $sha, body: $body, generate_release_notes: true}')"
          release="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$payload")"
          id="$(printf '%s' "$release" | jq -r .id)"

          # Keep a copy of exactly what shipped on the release itself.
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: text/javascript" \
            --data-binary @abacus-mental-math-helper.user.js \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=abacus-mental-math-helper.user.js" > /dev/null

          echo "Released $TAG: $(printf '%s' "$release" | jq -r .html_url)" >> "$GITHUB_STEP_SUMMARY"
