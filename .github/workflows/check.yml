name: Check userscript

on:
  push:
    branches: [main]
    paths: ["abacus-mental-math-helper.user.js"]
  pull_request:
    paths: ["abacus-mental-math-helper.user.js"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node --check abacus-mental-math-helper.user.js
