name: Check userscript

on:
  push:
    branches: [main]
    paths: ["abacus-mental-math-helper.user.js"]
  pull_request:
    paths: ["abacus-mental-math-helper.user.js"]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node --check abacus-mental-math-helper.user.js
