name: Build extension

on:
  push:
    branches: [main]
    paths: ["extension/**"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd extension
          zip -r ../abacus-mental-math-helper.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: abacus-mental-math-helper
          path: abacus-mental-math-helper.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: abacus-mental-math-helper.zip
